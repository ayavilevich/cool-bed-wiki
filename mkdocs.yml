# https://www.mkdocs.org/user-guide/configuration/
# example: https://github.com/mkdocs/mkdocs/blob/master/mkdocs.yml
site_name: AYG Cool Bed Wiki

theme:
  name: material
  palette: # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/
    # primary: 'indigo' 
    # accent: 'indigo'

repo_url: https://github.com/ayavilevich/cool-bed-wiki/
edit_uri: blob/main/docs/

plugins:
  - redirects:
      redirect_maps:
        'fw-web-ui-index.md': 'assembly/configuration.md'
        'fw-web-ui-config.md': 'assembly/configuration.md'

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Builds: builds.md
  - Components:
    - Mattress pad: components/mattress-pad.md
    - Pumps: components/pumps.md
    - Power supply: components/power-supply.md
    - Hoses: components/hoses.md
    - Containers: components/containers.md
    - Ice packs: components/ice-packs.md
    - Coolant: components/coolant.md
    - Controller board: components/controller-board.md
    - Controller enclosure: components/controller-enclosure.md
    - Temperature sensors: components/temperature-sensors.md
    - Heat exchanger: components/heat-exchanger.md
    - Water heater: components/water-heater.md
    - Flow sensor: components/flow-sensor.md
  - Assembly:
    - Firmware: assembly/firmware.md
    - Loops: assembly/loops.md
    - Configuration: assembly/configuration.md
    - MQTT: assembly/mqtt.md
  - Usage: usage.md
  - Troubleshooting: troubleshooting.md

